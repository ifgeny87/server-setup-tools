# Команды батча. Порядок — число в имени файла, при равном числе — путь.
# Вспомогательные 22-install-docker-ubuntu.sh и 22-install-docker-debian.sh
# сюда не входят: их вызывает 22-install-docker.sh.
#
# CMD путь
# RUN user
# ARG ИМЯ тип режим
#
# тип: string, ssh-key, email, domain, user, version, token, flag, port, ip
# режим: required — без значения неинтерактивный батч останавливается
#        optional — пустое значение допустимо, скрипт берёт своё умолчание
#
# В интерактивном режиме батч эти ARG не спрашивает и не проверяет.
# Промпт пишет сам скрипт, когда до него доходит очередь.
# TARGET_USER исключение: батч спрашивает его сразу перед шагом RUN user,
# потому что от этого имени запускает скрипт.

CMD 1-server-setup/10-prepare-tools.sh

CMD 1-server-setup/11-remove-mail-server.sh

CMD 1-server-setup/12-add-user.sh
ARG NEW_USER_LOGIN string required
ARG NEW_USER_SSH_KEY ssh-key required

CMD 1-server-setup/13-ssh-restrict.sh

CMD 1-server-setup/14-install-fail2ban.sh

CMD 1-server-setup/15-secure-firewall.sh

CMD 2-install-software/20-install-oh-my-zsh.sh
RUN user
ARG TARGET_USER user required

CMD 2-install-software/21-install-node.sh
ARG VERSION version optional

CMD 2-install-software/22-install-docker.sh

CMD 2-install-software/23-docker-autoprune.sh

CMD 2-install-software/24-install-nginx-certbot.sh
ARG CERTBOT_EMAIL email required

CMD 3-user-setup/30-setup-user-tools.sh
RUN user
ARG TARGET_USER user required

CMD 3-user-setup/31-generate-ssh-keys.sh
RUN user
ARG TARGET_USER user required
ARG SSH_KEY_COMMENT string optional

CMD 4-services/40-firewall-monitor.sh
ARG TELEGRAM_API_TOKEN token required
ARG TELEGRAM_CHAT_ID string required

CMD 4-services/41-add-ssl-certificate.sh
ARG DOMAIN domain required
ARG FORCE_NGINX flag optional

CMD 4-services/42-manage-forward.sh
ARG LOCAL_SSH_PORT port optional
ARG LOCAL_AWG_PORT port optional
ARG LOCAL_IP ip optional
ARG SERVER_SSH_PORT port optional
ARG SERVER_AWG_PORT port optional
ARG SERVER_IP ip optional

CMD 4-services/43-add-nginx-error-pages.sh

CMD 4-services/44-remove-nginx-error-pages.sh

CMD 4-services/45-security-audit.sh
